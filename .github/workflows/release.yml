name: Release

# Cut a release by pushing a tag:  git tag v1.0.0 && git push origin v1.0.0
#
# workflow_dispatch runs the identical pipeline but publishes a *draft*, so the
# whole thing can be rehearsed without announcing anything. Delete the draft
# afterwards.
#
# Deliberately passes no WiFi build-args: released firmware ships the stock
# AP-only defaults (the board still broadcasts its own hotspot). Do not add
# secrets here.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# No blanket permissions here: only the release job's `gh release create`
# needs write access, so it's scoped there instead of to the whole workflow.
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  firmware:
    name: ESP32 firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # load: true is required — unlike docker-builds.yml, which only proves
      # the image builds, this job has to `docker run` it afterwards, so the
      # image must land in the local daemon rather than only in the cache.
      - name: Build firmware image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: esp32-s3/Dockerfile
          push: false
          load: true
          tags: solectrac-fw:release
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=firmware
          cache-to: type=gha,scope=firmware,mode=max

      - name: Extract flash images
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" solectrac-fw:release
          # Guard the whole contract, not just the file we upload: a missing
          # individual image means the documented four-image flashing path
          # regressed, and that should fail the release too.
          for f in bootloader.bin partitions.bin boot_app0.bin firmware.bin firmware-merged.bin; do
            test -s "out/$f" || { echo "missing or empty: out/$f" >&2; exit 1; }
          done
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: out/firmware-merged.bin
          if-no-files-found: error

  android:
    name: Android app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Resolve short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Build Android image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: android/Dockerfile
          push: false
          load: true
          tags: solectrac-android:release
          build-args: |
            GIT_SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=android
          cache-to: type=gha,scope=android,mode=max

      - name: Extract APK
        run: |
          set -euo pipefail
          mkdir -p out
          docker run --rm -v "$PWD/out:/out" solectrac-android:release
          test -s out/app-debug.apk || { echo "missing or empty: out/app-debug.apk" >&2; exit 1; }
          ls -l out/

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: out/app-debug.apk
          if-no-files-found: error

  release:
    name: Publish release
    needs: [firmware, android]
    runs-on: ubuntu-latest
    # gh release create needs write access to the repo's releases; scoped
    # here rather than workflow-wide since firmware/android only build and
    # upload build artifacts.
    permissions:
      contents: write
    steps:
      # Both artifacts land in the same directory; their filenames don't collide.
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: android
          path: dist

      - name: Resolve version
        id: v
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            # Tag push: the tag is the version, and it already exists.
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            # Rehearsal: no tag exists, so --target tells gh which commit to
            # tag if the draft is ever published.
            echo "version=dev-$(echo '${{ github.sha }}' | cut -c1-7)" >> "$GITHUB_OUTPUT"
            echo "extra=--draft --target ${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      # Version goes through env rather than being interpolated straight into
      # the shell script text (`V='${{ ... }}'`) so a ref containing a single
      # quote can't break the quoting or inject shell — the value only ever
      # reaches the shell as an already-scoped variable.
      - name: Name the assets
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          set -euo pipefail
          test -s dist/firmware-merged.bin
          test -s dist/app-debug.apk
          mv dist/firmware-merged.bin "dist/solecan-firmware-rejsacan-$VERSION-merged.bin"
          mv dist/app-debug.apk       "dist/solecan-android-$VERSION-debug.apk"
          ls -l dist/

      # One gh call with both assets: the release either appears complete or
      # does not appear.
      # Create the release, or attach to one that already exists.
      #
      # Both orderings happen in practice and both must work:
      #
      #   - Push a bare tag (`git push origin v1.0.0`) — nothing exists yet,
      #     so this creates the release and attaches the assets.
      #   - Write the release notes in GitHub's Releases UI first — that
      #     publishes the tag as a side effect, which is what triggers this
      #     workflow. By the time this step runs the release already exists,
      #     and `gh release create` fails with "a release with the same tag
      #     name already exists". That is how v2.0.0 shipped with no
      #     binaries attached.
      #
      # So: attach if it exists, create if it doesn't. --clobber makes a
      # re-run replace same-named assets instead of erroring, which keeps
      # re-running a failed job safe.
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          # Deliberately expanded unquoted below: on the dispatch/rehearsal
          # path this is `--draft --target <sha>` and must word-split into
          # two separate gh arguments; on the tag-push path it's empty and
          # must vanish rather than pass through as an empty string arg.
          EXTRA: ${{ steps.v.outputs.extra }}
        run: |
          set -euo pipefail
          FIRMWARE="dist/solecan-firmware-rejsacan-$VERSION-merged.bin"
          APK="dist/solecan-android-$VERSION-debug.apk"

          if gh release view "$VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $VERSION already exists — uploading assets to it."
            gh release upload "$VERSION" --repo "$GITHUB_REPOSITORY" --clobber \
              "$FIRMWARE" "$APK"
          else
            echo "Creating release $VERSION."
            gh release create "$VERSION" $EXTRA \
              --repo "$GITHUB_REPOSITORY" \
              --title "$VERSION" \
              --generate-notes \
              "$FIRMWARE" "$APK"
          fi
